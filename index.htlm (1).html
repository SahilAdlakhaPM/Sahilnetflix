<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sahil Adlakha — Project Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E50914;--bg:#141414;--g:#b3b3b3}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg)}
body{color:#fff;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.bb,.logo,.kick b,h2,.n,.mark,#mt{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;transition:opacity .7s,visibility .7s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.mark{position:relative;font-size:min(48vmin,380px);line-height:1;color:var(--red);text-shadow:0 0 70px #e5091466;animation:zoom 2.8s cubic-bezier(.2,.7,.2,1) forwards;overflow:hidden;padding:0 .08em}
.mark::after{content:"";position:absolute;top:0;bottom:0;width:14%;left:-30%;background:linear-gradient(90deg,transparent,#ffffffcc,transparent);animation:sweep 1.1s .55s ease-out forwards}
.ssub{position:absolute;bottom:16vh;letter-spacing:.5em;font-size:13px;font-weight:700;color:#999;opacity:0;animation:in 1s 1s forwards}
@keyframes zoom{0%{transform:scale(.5);opacity:0;filter:blur(16px)}22%{opacity:1;filter:blur(0)}65%{transform:scale(1);opacity:1}100%{transform:scale(8);opacity:0}}
@keyframes sweep{to{left:120%}}
#profiles{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:28px 16px;overflow:auto;transition:opacity .45s,visibility .45s}
#profiles.hide{opacity:0;visibility:hidden;pointer-events:none}
#profiles h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:500}
.plist{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;max-width:900px}
.prof{width:clamp(92px,14vw,148px);color:var(--g);transition:color .2s;animation:in .6s both}
.av{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:clamp(2rem,5vw,3.3rem);border:3px solid transparent;transition:transform .2s,border-color .2s}
.prof:hover{color:#fff}.prof:hover .av{border-color:#fff;transform:scale(1.07)}
.pl{margin-top:10px;font-size:15px}.prof small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.mgr{border:1px solid var(--g);color:var(--g);padding:10px 26px;letter-spacing:.18em;font-size:13px;text-decoration:none;text-transform:uppercase}.mgr:hover{color:#fff;border-color:#fff}
#app{display:none}
nav.top{position:fixed;top:0;left:0;right:0;z-index:30;padding:14px 4%;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:24px;background:linear-gradient(#000c,transparent);transition:background .3s}
nav.top.solid{background:var(--bg)}
.logo{font-size:2.2rem;color:var(--red);letter-spacing:.04em;cursor:pointer}
nav.top a{font-size:14px;color:#e5e5e5;cursor:pointer}nav.top a:hover{color:var(--g)}
@media(max-width:760px){nav.top a{display:none}}
#me{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#ddd}#me .av{width:34px;border-radius:4px;font-size:1.1rem;border:0}
.bill{position:relative;min-height:86vh;display:flex;align-items:center;padding:90px 4% 120px;overflow:hidden}
.art{position:absolute;inset:0}.art span{position:absolute;right:7%;top:50%;transform:translateY(-50%);font-size:min(38vw,380px);opacity:.28}
.bill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#141414f0 0%,#14141400 65%),linear-gradient(0deg,#141414 0%,#14141400 38%)}
.bill .c{position:relative;z-index:2;max-width:580px;animation:in .7s}
.kick{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3em;font-size:12px;color:#ddd}.kick b{color:var(--red);font-size:30px;letter-spacing:0}
h2{font-size:clamp(3.4rem,9vw,6.6rem);line-height:.92;margin:12px 0 14px}
.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px;color:#ddd;margin-bottom:14px}
.match{color:#46d369;font-weight:700}.pill{border:1px solid #999;padding:0 7px;font-size:12px}
.bill p{font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.55;text-shadow:0 2px 6px #0009;margin-bottom:24px}
.btns{display:flex;gap:12px;flex-wrap:wrap}.b{padding:10px 26px;border-radius:4px;font-weight:700;font-size:1.05rem}
.b.w{background:#fff;color:#000}.b.w:hover{background:#ffffffbf}.b.g{background:#6d6d6eb3}.b.g:hover{background:#6d6d6e66}
#rows{position:relative;z-index:3;margin-top:-90px;padding-bottom:70px}
.row h3{font-size:1.2rem;font-weight:700;padding:0 4%;margin-bottom:2px}
.track{display:flex;gap:8px;overflow-x:auto;padding:14px 4% 34px;scrollbar-width:none}.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(230px,24vw,320px);aspect-ratio:16/9;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .3s,box-shadow .3s}
.card:hover{transform:scale(1.12);z-index:5;box-shadow:0 14px 30px #000a}.card.dead{cursor:default}
.card .n{position:absolute;top:0;right:12px;font-size:4.6rem;opacity:.3;line-height:1.1;font-style:normal}
.card b,.card span{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.card b{font-size:14.5px;line-height:1.3;-webkit-line-clamp:4}.card span{font-size:12px;color:#e8e8e8;margin-top:4px;-webkit-line-clamp:2}
#modal{position:fixed;inset:0;z-index:80;background:#000b;display:none;overflow:auto;padding:4vh 14px}#modal.on{display:block}
.mp{position:relative;max-width:860px;margin:0 auto;background:#181818;border-radius:8px;overflow:hidden;box-shadow:0 20px 60px #000;animation:in .35s}
#x{position:absolute;top:12px;right:12px;z-index:5;width:36px;height:36px;border-radius:50%;background:#181818;font-size:18px}
.player{position:relative;aspect-ratio:16/9;display:grid;place-items:center;padding:5% 10% 12%;text-align:center}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#181818 0%,#18181800 45%)}
#st{position:relative;z-index:2;font-size:clamp(1.05rem,2.7vw,1.7rem);font-weight:700;line-height:1.4;text-shadow:0 2px 10px #0008;animation:in .4s}
.ctrl{position:absolute;z-index:3;left:4%;right:4%;bottom:14px;display:flex;align-items:center;gap:12px;font-size:13px}
.ctrl button{font-size:18px;width:30px}.bar{flex:1;height:4px;background:#ffffff40;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red)}.bar i.go{animation:fill 5.5s linear forwards}.player.paused .bar i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.info{padding:22px 6% 34px}#mt{font-size:2.6rem;line-height:1}.info .meta{margin:10px 0}.info p{color:#d2d2d2;line-height:1.6;margin-bottom:12px}
.info ul{padding-left:20px;color:#d2d2d2;line-height:1.6}.info li{margin-bottom:6px}
.out{margin-top:16px;display:inline-block;background:#46d3691f;color:#46d369;border:1px solid #46d36955;padding:8px 14px;border-radius:6px;font-weight:700;font-size:14px}
@media(prefers-reduced-motion:reduce){.mark,.mark::after,.bill .c,.prof{animation-duration:.01s}}
.av svg{width:44%;height:44%;color:#fff}.art svg{position:absolute;right:7%;top:50%;transform:translateY(-50%);width:min(34vw,340px);height:auto;opacity:.16;color:#fff}.card .n svg{width:44px;height:44px}#me .av svg{width:58%}</style></head><body>

var TK=[['Project planning & delivery','Sprint planning, milestone tracking and delivery management, with risk and scope watched the whole way.','Scope → Milestones → Sprint → Delivery'],['Requirements & documentation','BRDs, FSDs and DPRs, plus wireframes that give development teams something precise to build against.','Requirement → Wireframe → FSD → Sign-off'],['Client & stakeholder management','Primary point of contact on live projects — workshops, demos, and feedback sessions through to approval.','Requirement → Demo → Feedback → Approval'],['Cross-functional coordination','The bridge between development, QA and design — clarifying requirements and clearing blockers.','Task → Team → Blocker → Resolved'],['Risk & status reporting','Spotting scope and timeline risk early, and keeping everyone aligned with regular status reporting.','Signal → Assess → Mitigate → Report'],['Tools & methods','Agile/Scrum delivery, backed by JIRA, Figma and Balsamiq for planning, and Tableau for reporting.','JIRA → Figma → Balsamiq → Tableau']].map(function(t,i){return{t:t[0],d:t[1],sc:[t[1],t[2]],n:i+1}});
var HW=[['Discover','Sit with the client to understand the business problem before anything gets scoped — this is where scope creep gets prevented, not fixed later.'],['Define','Turn the conversation into structured requirements — BRDs, FSDs and DPRs the development team can actually build from.'],['Plan','Set milestones, prioritise the backlog, and lay out a sprint plan the whole team can hold to.'],['Design','Work with the UI/UX team through wireframes and design closure, checking every workflow against the original ask.'],['Develop','Sit alongside the dev team through the build — clarifying requirements, running stand-ups, unblocking as issues surface.'],['Test','Support UAT and issue tracking, validating that what shipped actually matches what was scoped.'],['Review','Run the client demo, walk through what was built, and turn feedback into a clear, prioritised list.'],['Deliver','Close out remaining approvals and hand over a delivered product — with documentation the client can actually use.']].map(function(h,i){return{t:h[0],d:h[1],n:i+1}});

{k:1,i:'clip',c:['#E50914','#5a050b'],l:'Origin',t:'Where it all started',m:99,y:'2023 – 2024',r:'Project Coordinator',x:'Arete Consultants, Delhi',s:'My first real job in project delivery. I was the coordinator — the person making sure a requirement conversation actually turned into a document, and a document actually turned into working software.',pts:['Coordinated 5+ web and mobile projects for government and private clients, keeping everything on schedule.','Ran 10+ client requirement sessions, wrote up the minutes, and put together 25+ project proposals.','Tracked 20+ tasks a week across multiple project teams.','Wrote BRDs, DPRs and workflow diagrams so developers never had to guess what was needed.','Helped research and prepare government tenders — 3 successful submissions.']},
{k:2,i:'trend',c:['#0071EB','#082a63'],l:'Leveling up',t:'Leveling up',m:98,y:'2025',r:'Business Analyst',x:'TechGropse, Noida',s:'A new company, and a bigger seat at the table. I moved from coordinating projects to actually shaping them — wireframes, FSDs, and being the person clients trusted with the hard questions.',pts:['Owned end-to-end execution for 4–5 client projects — requirements, design approvals, sprint planning.','Stepped up as Interim Project Manager on critical projects, resolving 15+ team queries and running 10+ client demos.','Designed wireframes, wrote FSDs, and built milestone-based delivery plans across multiple modules.','Researched AI features (chatbots, facial analysis, recommendations) and helped shape the roadmap for 2 projects.','Revised sprint timelines and lifted delivery efficiency by 10–15%.','Mentored 2–3 interns along the way.']},

function ic(k){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>'}
var cur=0,CR=[],S={};
function grad(c){return'linear-gradient(135deg,'+c[0]+','+c[1]+')'}
function scenes(p){return p.sc||(p.pts?[p.s].concat(p.pts):[p.s].concat(p.cards.map(function(c){return c.t+' — '+c.d})))}
$('#plist').innerHTML=P.map(function(p,i){return'<button class="prof" data-i="'+i+'" style="animation-delay:'+(i*70)+'ms"><div class="av" style="background:'+grad(p.c)+'">'+ic(p.i)+'</div><div class="pl">'+p.l+'</div><small>Chapter '+p.k+'</small></button>'}).join('');
function rowsOf(p){var R=[];
if(p.pts)R.push({h:'Highlights from this chapter',cards:p.pts.map(function(t,i){return{t:t,n:i+1,at:i+1}})});
if(p.cards)R.push({h:p.rh,cards:p.cards});if(p.R)R=R.concat(p.R);
if(p.k==4)R.push({h:'From the archives',cards:more.map(function(m){return{t:m[0],d:m[1],dead:1}})});

return R}
function cardH(c,p,ri,ci){return'<div class="card'+(c.dead?' dead':'')+'" data-r="'+ri+'" data-c="'+ci+'" style="background:'+grad(c.c||p.c)+'">'+(c.n?'<i class="n">'+c.n+'</i>':c.i?'<i class="n">'+ic(c.i)+'</i>':'')+'<b>'+c.t+'</b>'+(c.d?'<span>'+c.d+'</span>':'')+'</div>'}
function pick(i){cur=i;var p=P[i];CR=rowsOf(p);
$('#profiles').classList.add('hide');$('#app').style.display='block';
var bt=p.b||[['▶ Play story','play'],['ⓘ Next chapter','next']];
$('#bill').innerHTML='<div class="art" style="background:linear-gradient(120deg,'+p.c[0]+','+p.c[1]+')">'+ic(p.i)+'</div><div class="c"><div class="kick"><b>S</b>CHAPTER '+p.k+'</div><h2>'+p.t+'</h2><div class="meta"><span class="match">'+p.m+'% Match</span><span>'+p.y+'</span><span class="pill">'+p.r+'</span><span>'+p.x+'</span></div><p>'+p.s+'</p><div class="btns"><button class="b w" data-a="'+bt[0][1]+'">'+(bt[0][1]==='play'?'':'')+bt[0][0]+'</button><button class="b g" data-a="'+bt[1][1]+'">'+bt[1][0]+'</button></div></div>';
$('#rows').innerHTML=CR.map(function(r,ri){return'<section class="row"><h3>'+r.h+'</h3><div class="track">'+r.cards.map(function(c,ci){return cardH(c,p,ri,ci)}).join('')+'</div></section>'}).join('');

window.scrollTo(0,0)}
function home(){$('#profiles').classList.remove('hide')}
function go(u){if(u==='RES'){var a=document.createElement('a');a.href=RH;a.download='Sahil_Adlakha_Resume.docx';a.click()}else if(u.indexOf('http')===0)window.open(u,'_blank','noopener');else location.href=u}
function scene(i){S.i=i;var t=$('#st');t.style.animation='none';void t.offsetWidth;t.style.animation='';t.textContent=S.sc[i];$('#cnt').textContent=(i+1)+' / '+S.sc.length;var b=$('#bar i');b.className='';void b.offsetWidth;b.className='go';$('#player').classList.remove('paused');$('#pp').textContent='❚❚'}
function openM(o){S={sc:o.sc,i:0};$('#mart').style.cssText='position:absolute;inset:0;background:linear-gradient(120deg,'+o.c[0]+','+o.c[1]+')';
$('#mt').textContent=o.t;$('#mm').innerHTML='<span class="match">'+(o.m||98)+'% Match</span>'+(o.tags||[]).map(function(x){return'<span class="pill">'+x+'</span>'}).join('');
$('#md').textContent=o.sc[0];$('#ml').innerHTML=o.sc.slice(1).map(function(x){return'<li>'+x+'</li>'}).join('');
$('#mo').innerHTML=o.o?'<div class="out">'+o.o+'</div>':'';$('#modal').classList.add('on');document.body.style.overflow='hidden';scene(o.at||0)}
function closeM(){$('#modal').classList.remove('on');document.body.style.overflow='';$('#bar i').className=''}

document.addEventListener('click',function(e){
var n=e.target.closest('[data-n]');if(n){var v=n.dataset.n;v==='home'?home():pick(+v);return}

var c=e.target.closest('.card');if(!c)return;var cd=CR[+c.dataset.r].cards[+c.dataset.c],p=P[cur];
if(cd.dead)return;if(cd.prof!=null){pick(cd.prof);return}if(cd.go){go(cd.go);return}if(cd.at!=null){play(cd.at);return}
openM({t:cd.t,sc:cd.sc||[cd.d],c:p.c,m:p.m,tags:cd.r?[cd.r]:[],o:cd.o})});
